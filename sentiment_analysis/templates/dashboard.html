<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENR Sentiment Analysis Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-glow: rgba(6, 182, 212, 0.15);
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --accent-cyan: #06b6d4;
            --accent-cyan-hover: #22d3ee;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-indigo: #6366f1;
            
            --shadow-sm: 0 2px 8px 0 rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            
            font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Glass Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-primary);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 320px;
            max-width: 450px;
            transform: translateX(120%);
            animation: slideIn 0.3s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            to { transform: translateX(0); }
        }

        .toast.success { border-left: 4px solid var(--accent-emerald); }
        .toast.error { border-left: 4px solid var(--accent-rose); }
        .toast.info { border-left: 4px solid var(--accent-cyan); }

        /* Container Layout */
        .container {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header Dashboard */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px 28px;
            box-shadow: var(--shadow-md);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-box {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-indigo) 100%);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 15px 0 rgba(6, 182, 212, 0.4);
        }

        .brand-info h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.online {
            background: var(--accent-emerald);
            box-shadow: 0 0 10px 2px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .card-title svg {
            color: var(--accent-cyan);
        }

        /* Dashboard Main Content Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 4fr 5fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Buttons & Forms */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-indigo) 100%);
            box-shadow: 0 4px 15px 0 rgba(6, 182, 212, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-cyan-hover) 0%, var(--accent-indigo) 100%);
            box-shadow: 0 4px 20px 0 rgba(6, 182, 212, 0.35);
        }

        .btn-success {
            background: var(--accent-emerald);
        }

        .btn-success:hover {
            background: #14b8a6;
        }

        .btn-icon {
            padding: 8px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px 0 rgba(6, 182, 212, 0.15);
        }

        /* Config List */
        .config-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .config-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .config-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .config-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .config-name {
            font-size: 14px;
            font-weight: 600;
        }

        .config-active-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 20px;
            font-weight: 700;
        }

        .config-active-tag.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .config-active-tag.inactive {
            background: rgba(244, 63, 94, 0.1);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .config-detail {
            font-size: 11px;
            color: var(--text-secondary);
            word-break: break-all;
        }

        .config-cron {
            font-size: 11px;
            color: var(--accent-cyan);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .config-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Log Table */
        .log-table-container {
            overflow-x: auto;
            max-height: 480px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--glass-border);
            font-size: 11px;
            text-transform: uppercase;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .log-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .log-status.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
        }

        .log-status.failed {
            background: rgba(244, 63, 94, 0.1);
            color: var(--accent-rose);
        }

        .log-status.running {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(6, 182, 212, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); }
        }

        /* Sentiment Badges */
        .sentiment-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            text-transform: uppercase;
        }

        .sentiment-badge.Positive {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .sentiment-badge.Negative {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .sentiment-badge.Neutral {
            background: rgba(156, 163, 175, 0.15);
            color: var(--text-secondary);
            border: 1px solid rgba(156, 163, 175, 0.2);
        }

        /* Article List Feed */
        .article-feed-card {
            width: 100%;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            max-height: 800px;
            overflow-y: auto;
            padding-right: 6px;
        }

        @media (max-width: 640px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }
        }

        .article-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .article-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
        }

        .article-card.positive-accent::after { background: var(--accent-emerald); }
        .article-card.negative-accent::after { background: var(--accent-rose); }
        .article-card.neutral-accent::after { background: var(--text-secondary); }

        .article-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .article-source-tag {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .article-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .article-snippet {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 10px;
            margin-top: auto;
        }

        .article-author-date {
            display: flex;
            gap: 12px;
        }

        /* Loading spinner styling */
        .spinner {
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Modal Drawer Detail */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0d131f;
            border-left: 1px solid var(--glass-border);
            width: 100%;
            max-width: 650px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .modal.open .modal-content {
            transform: translateX(0);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .close-btn {
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-secondary);
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .section-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
        }

        .section-box h3 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 6px;
        }

        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .aspect-row:last-child {
            border-bottom: none;
        }

        .aspect-name {
            font-size: 13px;
            font-weight: 600;
        }

        .aspect-reason {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        .driver-list {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .driver-item {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-secondary);
            position: relative;
            padding-left: 16px;
        }

        .driver-item::before {
            content: "•";
            color: var(--accent-cyan);
            font-weight: bold;
            position: absolute;
            left: 4px;
        }

        .entity-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .entity-tag {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-flex;
            gap: 6px;
        }

        .entity-tag-label {
            color: var(--accent-indigo);
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
        }

        .ocr-box {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            color: var(--text-secondary);
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .article-content-full {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }

        .badge-score {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="container">
        
        <!-- Header -->
        <header>
            <div class="brand-section">
                <div class="logo-box">S</div>
                <div class="brand-info">
                    <h1>ENR Sentiment Analysis Hub</h1>
                    <p>Enterprise NLP & Scraping Orchestration</p>
                </div>
            </div>
            
            <div class="system-status">
                <div class="status-badge">
                    <span id="health-dot" class="status-dot"></span>
                    <span id="health-text">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="dashboard-grid">
            
            <!-- Column 1: Scraper Configs -->
            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <!-- Website Icon -->
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        Scraper Configurations
                    </div>
                    <button class="btn btn-primary" onclick="showCreateModal()">Add New Config</button>
                </div>
                
                <div id="config-list" class="config-list">
                    <!-- Config items loaded dynamically -->
                </div>
            </div>

            <!-- Column 2: Scraper Execution Logs -->
            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <!-- History Icon -->
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Scraper Execution History
                    </div>
                    <button class="btn" onclick="loadLogs()">Refresh Logs</button>
                </div>
                
                <div class="log-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Source</th>
                                <th>Status</th>
                                <th>Scraped</th>
                                <th>Updated</th>
                                <th>Started At</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body">
                            <!-- Logs loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>

        <!-- Row: Scraped Articles & Sentiments Feed -->
        <div class="glass-card article-feed-card">
            <div class="card-header">
                <div class="card-title">
                    <!-- Article List Icon -->
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 4a2 2 0 0 0-2-2h-3v6l3-3 3 3V10z"></path>
                    </svg>
                    Analyzed Articles Feed
                </div>
                <button class="btn" onclick="loadArticles()">Refresh Feed</button>
            </div>
            
            <div id="articles-grid" class="articles-grid">
                <!-- Articles loaded dynamically -->
            </div>
        </div>

    </div>

    <!-- Edit/Create Config Modal -->
    <div id="config-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="config-modal-title" style="font-size: 18px; font-weight: 700;">Add Scraper Config</h2>
                <button class="close-btn" onclick="closeConfigModal()">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="config-form" onsubmit="saveConfig(event)" style="display: flex; flex-direction: column; gap: 16px;">
                    
                    <div class="form-group">
                        <label for="config-name">Source Name</label>
                        <input type="text" id="config-name" required placeholder="e.g. Reuters Energy">
                    </div>
                    
                    <div class="form-group">
                        <label for="config-base-url">Base URL</label>
                        <input type="url" id="config-base-url" required placeholder="e.g. https://www.reuters.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="config-scrape-url">Listing Scrape URL</label>
                        <input type="url" id="config-scrape-url" required placeholder="e.g. https://www.reuters.com/business/energy/">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="config-cron">Schedule Cron Expression</label>
                            <input type="text" id="config-cron" required value="0 9 * * 1" placeholder="e.g. 0 9 * * 1">
                        </div>
                        <div class="form-group">
                            <label for="config-active">Is Active</label>
                            <select id="config-active" style="background: rgba(0, 0, 0, 0.2); padding: 10px 14px;">
                                <option value="true">Active</option>
                                <option value="false">Deactivated</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 6px;">
                        <input type="checkbox" id="scrape-immediately" style="width: auto; cursor: pointer;">
                        <label for="scrape-immediately" style="cursor: pointer; text-transform: none; font-size: 12px; color: var(--text-primary);">Scrape immediately after saving</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%;">Save Configuration</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Article Inspect Drawer Modal -->
    <div id="inspect-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span id="inspect-source" class="article-source-tag" style="width: max-content;">SOURCE</span>
                    <h2 id="inspect-title" style="font-size: 18px; font-weight: 700; line-height: 1.3;">Article Title</h2>
                </div>
                <button class="close-btn" onclick="closeInspectModal()">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="inspect-modal-body">
                <!-- Data loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const API_BASE = '/api/v1';
        let scraperConfigs = [];

        // Toast Helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let iconSvg = '';
            if (type === 'success') {
                iconSvg = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>`;
            } else if (type === 'error') {
                iconSvg = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                iconSvg = `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
            }
            
            toast.innerHTML = `${iconSvg} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'none';
                toast.offsetHeight; /* trigger reflow */
                toast.style.animation = 'slideIn 0.3s reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            checkHealth();
            loadConfigs();
            loadLogs();
            loadArticles();
            
            // Periodically check health and refresh logs
            setInterval(checkHealth, 30000);
            setInterval(loadLogs, 30000);
        });

        // Check Backend Health
        async function checkHealth() {
            const dot = document.getElementById('health-dot');
            const text = document.getElementById('health-text');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                if (data.status === 'healthy') {
                    dot.className = 'status-dot online';
                    text.innerText = 'Microservice Online';
                } else {
                    dot.className = 'status-dot';
                    text.innerText = 'Service Unhealthy';
                }
            } catch (err) {
                dot.className = 'status-dot';
                text.innerText = 'Offline / Connection Failed';
            }
        }

        // Get Scraper Configurations
        async function loadConfigs() {
            try {
                const response = await fetch(`${API_BASE}/scraper/configs`);
                scraperConfigs = await response.json();
                renderConfigs();
            } catch (err) {
                showToast('Failed to load scraper configurations', 'error');
            }
        }

        function renderConfigs() {
            const list = document.getElementById('config-list');
            if (scraperConfigs.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: var(--text-secondary); font-size: 13px;">
                        No scraper configurations found. Create one to begin.
                    </div>
                `;
                return;
            }
            
            list.innerHTML = scraperConfigs.map(config => `
                <div class="config-item">
                    <div class="config-meta">
                        <div class="config-title-row">
                            <span class="config-name">${escapeHtml(config.name)} <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">(ID: ${config.id})</span></span>
                            <span class="config-active-tag ${config.is_active ? 'active' : 'inactive'}">
                                ${config.is_active ? 'Active' : 'Disabled'}
                            </span>
                        </div>
                        <div class="config-detail" style="margin-top: 2px;">
                            <strong>Feed URL:</strong> ${escapeHtml(config.scrape_url)}
                        </div>
                        <div class="config-cron">
                            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Cron: ${escapeHtml(config.schedule_cron)}
                        </div>
                    </div>
                    <div class="config-actions">
                        <button class="btn btn-icon btn-success" title="Scrape Now (Immediate)" onclick="triggerScrape(${config.id}, event)" id="btn-scrape-${config.id}">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </button>
                        <button class="btn btn-icon" title="Delete Config" style="color: var(--accent-rose);" onclick="deleteConfig(${config.id}, event)">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Trigger Scrape at that moment
        async function triggerScrape(configId, event) {
            if (event) event.stopPropagation();
            
            const btn = document.getElementById(`btn-scrape-${configId}`);
            const originalHtml = btn.innerHTML;
            
            // Set loading spinner state
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="spinner" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.2)"></circle>
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m6.36 6.36l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m6.36-6.36l2.83-2.83"></path>
                </svg>
            `;
            
            showToast('Triggering scraper run immediately. This might take up to a minute...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/scraper/configs/${configId}/run`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.status === 200 && data.status === 'success') {
                    showToast(`Scrape completed! Scraped: ${data.articles_scraped}, Updated: ${data.articles_updated}`, 'success');
                } else {
                    showToast(`Scraper finished with errors: ${data.error_message || 'Unknown error'}`, 'error');
                }
            } catch (err) {
                showToast('Failed to execute manual scraper', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                loadLogs();
                loadArticles();
            }
        }

        // Get Historical Execution Logs
        async function loadLogs() {
            try {
                const response = await fetch(`${API_BASE}/scraper/logs?limit=15`);
                const logs = await response.json();
                renderLogs(logs);
            } catch (err) {
                showToast('Failed to load scraper execution history', 'error');
            }
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('log-table-body');
            if (logs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 24px; color: var(--text-secondary);">
                            No scraping executions recorded.
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = logs.map(log => {
                const config = scraperConfigs.find(c => c.id === log.config_id);
                const sourceName = config ? config.name : `Source #${log.config_id}`;
                const startTime = new Date(log.started_at).toLocaleString();
                
                return `
                    <tr>
                        <td style="font-weight: 600;">${escapeHtml(sourceName)}</td>
                        <td>
                            <span class="log-status ${log.status}">
                                ${log.status}
                            </span>
                        </td>
                        <td style="font-weight: 500;">${log.articles_scraped}</td>
                        <td style="font-weight: 500;">${log.articles_updated}</td>
                        <td style="color: var(--text-secondary); font-size: 11px;">${startTime}</td>
                        <td>
                            ${log.error_message ? `
                                <button class="btn btn-icon" style="padding: 4px 8px; font-size: 11px;" title="View Error" onclick="alert('Scraper Error Message:\\n\\n${escapeJsString(log.error_message)}')">
                                    View Error
                                </button>
                            ` : '<span style="color: var(--text-muted);">None</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Get Scraped Articles
        async function loadArticles() {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                    <svg class="spinner" width="30" height="30" fill="none" stroke="var(--accent-cyan)" stroke-width="2.5" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.05)"></circle>
                        <path d="M12 2a10 10 0 0 1 10 10"></path>
                    </svg>
                    <p style="margin-top: 12px; color: var(--text-secondary); font-size: 13px;">Analyzing feed data...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/articles?limit=30`);
                const articles = await response.json();
                renderArticles(articles);
            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 30px; color: var(--accent-rose); font-size: 13px;">
                        Failed to load analyzed articles feed.
                    </div>
                `;
            }
        }

        function renderArticles(articles) {
            const grid = document.getElementById('articles-grid');
            if (articles.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px; border: 1px dashed var(--glass-border); border-radius: 16px;">
                        <p style="color: var(--text-secondary); font-size: 14px; font-weight: 500;">No articles scraped yet.</p>
                        <p style="color: var(--text-muted); font-size: 11px; margin-top: 4px;">Click the "Scrape Now" play button on any configuration above to pull live content.</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = articles.map(art => {
                const label = art.overall_sentiment.label;
                let accentClass = 'neutral-accent';
                if (label === 'Positive') accentClass = 'positive-accent';
                if (label === 'Negative') accentClass = 'negative-accent';
                
                const formattedDate = art.article.published_date || 'Unknown date';
                const author = art.article.author ? `By ${art.article.author}` : '';
                
                return `
                    <div class="article-card ${accentClass}" onclick="inspectArticle(${escapeHtml(JSON.stringify(art))})">
                        <div class="article-header">
                            <span class="article-source-tag">${escapeHtml(art.article.source || 'web')}</span>
                            <span class="sentiment-badge ${label}">${label} <span class="badge-score">${(art.overall_sentiment.confidence * 100).toFixed(0)}%</span></span>
                        </div>
                        <h3 class="article-title">${escapeHtml(art.article.title || 'Untitled Article')}</h3>
                        <p class="article-snippet">${escapeHtml(art.summary || art.article.content || '')}</p>
                        <div class="article-footer">
                            <div class="article-author-date">
                                <span>${escapeHtml(formattedDate)}</span>
                                ${author ? `<span>${escapeHtml(author)}</span>` : ''}
                            </div>
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="opacity: 0.6;">
                                <path d="M9 5l7 7-7 7"></path>
                            </svg>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Inspect Article in Drawer
        function inspectArticle(art) {
            const modal = document.getElementById('inspect-modal');
            document.getElementById('inspect-source').innerText = art.article.source || 'web';
            document.getElementById('inspect-title').innerText = art.article.title || 'Untitled Article';
            
            const body = document.getElementById('inspect-modal-body');
            
            // Aspect Sentiments
            let aspectHtml = '<p style="font-size:12px; color:var(--text-muted);">No aspect sentiments detected.</p>';
            if (art.aspect_sentiment && art.aspect_sentiment.length > 0) {
                aspectHtml = art.aspect_sentiment.map(asp => `
                    <div class="aspect-row">
                        <div>
                            <span class="aspect-name">${escapeHtml(asp.aspect)}</span>
                            <div class="aspect-reason">${escapeHtml(asp.reason || '')}</div>
                        </div>
                        <span class="sentiment-badge ${asp.sentiment}">${asp.sentiment} <span class="badge-score">${(asp.confidence * 100).toFixed(0)}%</span></span>
                    </div>
                `).join('');
            }
            
            // Sentiment Drivers
            let driverHtml = '<p style="font-size:12px; color:var(--text-muted);">No drivers extracted.</p>';
            if (art.sentiment_drivers && art.sentiment_drivers.length > 0) {
                driverHtml = `
                    <ul class="driver-list">
                        ${art.sentiment_drivers.map(d => `<li class="driver-item">${escapeHtml(d)}</li>`).join('')}
                    </ul>
                `;
            }
            
            // Named Entities
            let entityHtml = '<p style="font-size:12px; color:var(--text-muted);">No named entities identified.</p>';
            if (art.entities && art.entities.length > 0) {
                entityHtml = `
                    <div class="entity-tags">
                        ${art.entities.map(e => `
                            <span class="entity-tag">
                                <span style="font-weight:600;">${escapeHtml(e.text)}</span>
                                <span class="entity-tag-label">${escapeHtml(e.label)}</span>
                            </span>
                        `).join('')}
                    </div>
                `;
            }
            
            // OCR
            let ocrHtml = '<p style="font-size:12px; color:var(--text-muted);">No image OCR text extracted.</p>';
            if (art.ocr && art.ocr.ocr_text && art.ocr.ocr_text.length > 0 && art.ocr.ocr_text.some(t => t.trim())) {
                ocrHtml = `
                    <div class="ocr-box">${escapeHtml(art.ocr.ocr_text.join('\n'))}</div>
                    <div style="font-size:10px; color:var(--text-muted); margin-top:6px;">
                        Images found: ${art.ocr.images_found} | Images processed: ${art.ocr.images_processed}
                    </div>
                `;
            } else if (art.ocr && art.ocr.images_found > 0) {
                ocrHtml = `
                    <div style="font-size:12px; color:var(--text-muted);">
                        Detected ${art.ocr.images_found} images, but OCR returned no readable text.
                    </div>
                `;
            }

            body.innerHTML = `
                <!-- Overall Sentiment Card -->
                <div class="section-box" style="border-left: 4px solid ${art.overall_sentiment.label === 'Positive' ? 'var(--accent-emerald)' : art.overall_sentiment.label === 'Negative' ? 'var(--accent-rose)' : 'var(--text-secondary)'}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase;">Overall Classification</span>
                        <span class="sentiment-badge ${art.overall_sentiment.label}">${art.overall_sentiment.label} <span class="badge-score">${(art.overall_sentiment.confidence * 100).toFixed(0)}%</span></span>
                    </div>
                    <p style="font-size:13px; line-height:1.5; color:var(--text-primary); font-weight:500;">
                        ${escapeHtml(art.overall_sentiment.reasoning || 'No overall reasoning provided.')}
                    </p>
                </div>

                <!-- Executive Summary -->
                <div class="section-box">
                    <h3>Executive Business Summary</h3>
                    <p style="font-size:13px; line-height:1.5; color:var(--text-secondary);">
                        ${escapeHtml(art.summary || 'Summary generation skipped or unavailable.')}
                    </p>
                </div>

                <!-- Aspect Sentiment Breakdown -->
                <div class="section-box">
                    <h3>Aspect-Based Sentiment (ABSA)</h3>
                    ${aspectHtml}
                </div>

                <!-- Key Drivers -->
                <div class="section-box">
                    <h3>Business Driver Sentences</h3>
                    ${driverHtml}
                </div>

                <!-- Named Entities -->
                <div class="section-box">
                    <h3>Extracted Entities</h3>
                    ${entityHtml}
                </div>

                <!-- Image OCR -->
                <div class="section-box">
                    <h3>OCR Analysis (Embedded Charts/Graphics)</h3>
                    ${ocrHtml}
                </div>

                <!-- Full Scraped Content -->
                <div class="section-box">
                    <h3>Scraped Article Text</h3>
                    <div class="article-content-full">${escapeHtml(art.article.content || '')}</div>
                </div>
            `;
            
            modal.classList.add('open');
        }

        function closeInspectModal() {
            document.getElementById('inspect-modal').classList.remove('open');
        }

        // Add / Edit Modal Actions
        function showCreateModal() {
            document.getElementById('config-modal-title').innerText = 'Add Scraper Configuration';
            document.getElementById('config-id').value = '';
            document.getElementById('config-form').reset();
            document.getElementById('scrape-immediately').checked = true;
            document.getElementById('config-modal').classList.add('open');
        }

        function closeConfigModal() {
            document.getElementById('config-modal').classList.remove('open');
        }

        // Save Config (Submit handler)
        async function saveConfig(event) {
            event.preventDefault();
            const name = document.getElementById('config-name').value;
            const base_url = document.getElementById('config-base-url').value;
            const scrape_url = document.getElementById('config-scrape-url').value;
            const schedule_cron = document.getElementById('config-cron').value;
            const is_active = document.getElementById('config-active').value === 'true';
            const runImmediately = document.getElementById('scrape-immediately').checked;

            const payload = { name, base_url, scrape_url, schedule_cron, is_active };
            
            try {
                // Create config via POST
                const response = await fetch(`${API_BASE}/scraper/configs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.status === 201) {
                    showToast('Configuration saved successfully!', 'success');
                    closeConfigModal();
                    await loadConfigs();
                    
                    if (runImmediately && data.id) {
                        // Trigger immediate run asynchronous call
                        triggerScrape(data.id);
                    }
                } else {
                    showToast(`Error: ${data.detail || 'Failed to save config'}`, 'error');
                }
            } catch (err) {
                showToast('Network error saving configuration', 'error');
            }
        }

        // Delete Config
        async function deleteConfig(id, event) {
            if (event) event.stopPropagation();
            if (!confirm('Are you sure you want to delete this scraper configuration?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/scraper/configs/${id}`, {
                    method: 'DELETE'
                });
                if (response.status === 204) {
                    showToast('Configuration deleted successfully', 'success');
                    loadConfigs();
                    loadLogs();
                } else {
                    showToast('Failed to delete configuration', 'error');
                }
            } catch (err) {
                showToast('Network error deleting configuration', 'error');
            }
        }

        // HTML & JS Escaping utils
        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJsString(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '\\"')
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '\\r');
        }
    </script>
</body>
</html>
